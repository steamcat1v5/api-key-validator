// ─── 智力测试 ─────────────────
function loadQuizSetting() {
  try {
    quizSelectedId = localStorage.getItem('quizSelectedId') || '';
    quizJudgeProvider = localStorage.getItem('quizJudgeProvider') || '';
  } catch(e) {}
  updateQuizUI();
}

function toggleQuizMenu() {
  const menu = document.getElementById('quizMenu');
  menu.classList.toggle('open');
  if (menu.classList.contains('open')) {
    populateQuizSelects();
  }
}

function populateQuizSelects() {
  // 题目下拉
  const qSel = document.getElementById('quizSelect');
  qSel.innerHTML = QUIZ_BANK.map(q => `<option value="${q.id}" ${q.id===quizSelectedId?'selected':''}>${q.title}</option>`).join('');
  // 裁判下拉——从 providersData 选（只要有 model 或 api_keys 就可选用，放宽避免有 provider 被漏掉）
  const jSel = document.getElementById('quizJudgeSelect');
  const judges = providersData.filter(p => p.selected_model || (p.models && p.models.length > 0));
  let opts = '<option value="">-- 请选择 --</option>' + judges.map(p =>
    `<option value="${esc(p.name)}" ${p.name===quizJudgeProvider?'selected':''}>${esc(p.name)} (${esc(p.selected_model||'未选模型')})</option>`).join('');
  // 保底：如果 quizJudgeProvider 不在可选列表里（provider 被删/改名/model 清空），追加一个灰色选项
  if (quizJudgeProvider && !judges.find(p => p.name === quizJudgeProvider)) {
    // 检查是被删了还是 model 空了——直接追加显示
    const p = providersData.find(x => x.name === quizJudgeProvider);
    const label = p ? `${esc(p.name)} (${esc(p.selected_model||'未选模型')})` : `${esc(quizJudgeProvider)} (已失效)`;
    opts += `<option value="${esc(quizJudgeProvider)}" selected>${label}</option>`;
  }
  jSel.innerHTML = opts;
  // 提示
  const hint = document.getElementById('quizHint');
  const q = QUIZ_BANK.find(x => x.id === quizSelectedId);
  if (q && quizJudgeProvider) {
    hint.textContent = `当前选择：「${q.title}」, 裁判：${quizJudgeProvider}`;
    hint.style.color = 'var(--green)';
  } else if (q) {
    hint.textContent = `已选题「${q.title}」但未选裁判，请选一个裁判 provider。`;
    hint.style.color = 'var(--text2)';
  } else {
    hint.textContent = '选择一道题 + 一个裁判 provider，点「✓ 确认」保存。';
    hint.style.color = 'var(--text2)';
  }
}

function confirmQuizSetting() {
  quizSelectedId = document.getElementById('quizSelect').value;
  quizJudgeProvider = document.getElementById('quizJudgeSelect').value;
  if (!quizSelectedId) { showToast('⚠️ 请先选择题目', 'error'); return; }
  if (!quizJudgeProvider) { showToast('⚠️ 请先选择裁判 provider', 'error'); return; }
  // 检查裁判 provider 有没有 API Key
  const jp = providersData.find(p => p.name === quizJudgeProvider);
  if (jp && (!jp.api_keys || jp.api_keys.length === 0 || !jp.api_keys[0])) {
    showToast(`⚠️ 裁判「${quizJudgeProvider}」没有 API Key，无法评分。请先填或换一个`, 'error');
    return;
  }
  try {
    localStorage.setItem('quizSelectedId', quizSelectedId);
    localStorage.setItem('quizJudgeProvider', quizJudgeProvider);
  } catch(e) {}
  document.getElementById('quizMenu').classList.remove('open');
  updateQuizUI();
  renderAll();
  const q = QUIZ_BANK.find(x => x.id === quizSelectedId);
  showToast(`🧠 已确认：「${q ? q.title : '?'}」`, 'success');
}

function updateQuizUI() {
  const btn = document.getElementById('btnQuiz');
  if (quizSelectedId) {
    const q = QUIZ_BANK.find(x => x.id === quizSelectedId);
    btn.classList.add('active');
    btn.textContent = `🧠 智测: ${q ? q.title : '?'}`;
  } else {
    btn.classList.remove('active');
    btn.textContent = '🧠 智力测试';
  }
}

// 获取当前选中题目对象
function getCurrentQuiz() {
  if (!quizSelectedId) return null;
  return QUIZ_BANK.find(q => q.id === quizSelectedId) || null;
}

// 获取裁判 provider 信息
function getJudgeProvider() {
  if (!quizJudgeProvider) return null;
  return providersData.find(p => p.name === quizJudgeProvider) || null;
}

// 点击外部关闭菜单
document.addEventListener('click', (e) => {
  const dropdown = document.querySelector('.quiz-dropdown');
  if (dropdown && !dropdown.contains(e.target)) {
    document.getElementById('quizMenu')?.classList.remove('open');
  }
});

function copyKey(name) {
  const p = providersData.find(x => x.name === name);
  const key = p ? (p.api_keys || []).join('\n') : '';
  if (!key) { showToast('⚠️ 无 Key 可复制', 'error'); return; }
  // fallback: 使用 textarea 复制，兼容非 HTTPS 环境
  const ta = document.createElement('textarea');
  ta.value = key;
  ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('📋 已复制 API Key', 'success');
  } catch(e) {
    showToast('❌ 复制失败，请手动选择复制', 'error');
  }
  document.body.removeChild(ta);
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 3000);
}
