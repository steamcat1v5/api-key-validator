<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔑 API Key Validator</title>
<style>
/* ─── 本地字体 ─── */
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/static/fonts/inter-400.woff2') format('woff2'), url('/static/fonts/inter-400.ttf') format('truetype'); }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('/static/fonts/inter-500.woff2') format('woff2'), url('/static/fonts/inter-500.ttf') format('truetype'); }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('/static/fonts/inter-600.woff2') format('woff2'), url('/static/fonts/inter-600.ttf') format('truetype'); }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 700; font-display: swap; src: url('/static/fonts/inter-700.woff2') format('woff2'), url('/static/fonts/inter-700.ttf') format('truetype'); }
@font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/static/fonts/jetbrains-mono-400.woff2') format('woff2'), url('/static/fonts/jetbrains-mono-400.ttf') format('truetype'); }
@font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('/static/fonts/jetbrains-mono-500.woff2') format('woff2'), url('/static/fonts/jetbrains-mono-500.ttf') format('truetype'); }

/* ─── 主题变量 ─── */
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #242836; --surface3: #2d3146;
  --border: #2e3345; --text: #e1e4ed; --text2: #8b8fa3;
  --accent: #6c5ce7; --accent2: #a29bfe;
  --green: #00cec9; --red: #ff6b6b; --orange: #ffa502; --blue: #74b9ff; --yellow: #fdcb6e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display:flex; align-items:center; gap: 12px; }
header h1 { font-size: 18px; font-weight: 600; flex: 1; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 500; }
.github-link { color: var(--text2); transition: color 0.15s; display: flex; align-items: center; }
.github-link:hover { color: var(--text); }

.container { max-width: 1600px; margin: 0 auto; padding: 16px 20px; }

/* ─── 工具栏 ─── */
.toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.btn {
  padding: 6px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
  border: none; cursor: pointer; transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
}
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); }
.btn-secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
.btn-save { background: #00cec922; color: var(--green); border: 1px solid #00cec944; }
.btn-save:hover:not(:disabled) { background: #00cec944; }
.btn-danger { background: #e74c3c22; color: var(--red); }

/* ─── 智力测试下拉菜单 ─── */
.quiz-dropdown { position: relative; display: inline-block; }
.quiz-dropdown .btn-quiz {
  background: var(--surface2); color: var(--text2); border: 1px solid var(--border);
}
.quiz-dropdown .btn-quiz:hover { border-color: var(--accent); color: var(--text); }
.quiz-dropdown .btn-quiz.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.quiz-dropdown .btn-quiz.active:hover { background: var(--accent2); }
.quiz-menu {
  display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 1000;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; min-width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  font-size: 12.5px;
}
.quiz-menu.open { display: block; }
.quiz-menu .qm-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.quiz-menu .qm-row label { font-size: 11px; color: var(--text2); width: 40px; flex-shrink: 0; font-weight: 600; }
.quiz-menu .qm-row select {
  flex: 1; padding: 5px 8px; font-size: 12px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 4px; color: var(--text); outline: none;
}
.quiz-menu .qm-row select:focus { border-color: var(--accent); }
.quiz-menu .qm-hint { font-size: 10.5px; color: var(--text2); margin: 4px 0 8px; line-height: 1.5; }
.quiz-menu .qm-actions { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.quiz-menu .qm-actions button { flex: 1; padding: 5px 8px; border-radius: 4px; font-size: 11.5px; border: none; cursor: pointer; }
.btn-danger:hover:not(:disabled) { background: #e74c3c44; }
.btn-fetch { background: #74b9ff22; color: var(--blue); border: 1px solid #74b9ff44; }
.btn-xs {
  padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 400;
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn-xs:hover { border-color: var(--accent); color: var(--text); }

/* ─── 布局 ─── */
.main-layout { display: flex; gap: 16px; }
.list-panel { width: 260px; flex-shrink: 0; }
.detail-panel { flex: 1; min-width: 0; }
.log-column { width: 600px; flex-shrink: 0; display: flex; }
.log-column .log-panel { flex: 1; }

/* ─── Provider 列表 ─── */
.list-panel h3 { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.provider-item {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 6px; cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 8px;
}
.provider-item:hover { border-color: var(--accent); }
.provider-item.active { border-color: var(--accent); background: var(--surface2); }
.provider-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.available,.dot.valid { background: var(--green); box-shadow: 0 0 4px var(--green); }
.dot.invalid,.dot.auth_error,.dot.not_supported { background: var(--red); box-shadow: 0 0 4px var(--red); }
.dot.rate_limited { background: var(--orange); box-shadow: 0 0 4px var(--orange); }
.dot.error,.dot.timeout { background: var(--orange); }
.dot.idle { background: var(--text2); opacity: 0.3; }
.dot.no_model { background: var(--text2); opacity: 0.5; }
.provider-item .p-name { font-size: 13px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.provider-item .p-type { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--surface3); color: var(--text2); }
.provider-item .p-status { font-size: 11px; color: var(--text2); }
.provider-item .btn-del-item {
  background: none; border: none; color: var(--text2); cursor: pointer;
  font-size: 13px; padding: 2px 6px; border-radius: 4px;
  opacity: 0; transition: all 0.15s; line-height: 1;
}
.provider-item:hover .btn-del-item { opacity: 0.7; }
.provider-item .btn-del-item:hover { opacity: 1; color: var(--red); background: rgba(255,80,80,0.15); }
.provider-item .btn-clone-item {
  background: none; border: none; color: var(--text2); cursor: pointer;
  font-size: 13px; padding: 2px 6px; border-radius: 4px;
  opacity: 0; transition: all 0.15s; line-height: 1;
}
.provider-item:hover .btn-clone-item { opacity: 0.7; }
.provider-item .btn-clone-item:hover { opacity: 1; color: var(--accent); background: rgba(100,160,255,0.15); }
/* 克隆/删除按钮浮动在右侧，不占布局空间，hover 时覆盖协议标签 */
.provider-item .p-actions { display: flex; gap: 2px; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
.provider-item { position: relative; }
.provider-item:hover .p-type { opacity: 0; }
/* 拖拽排序 */
.provider-item.dragging { opacity: 0.4; border-style: dashed; }
.provider-item.drag-over-top { box-shadow: 0 -2px 0 0 var(--accent); }
.provider-item.drag-over-bottom { box-shadow: 0 2px 0 0 var(--accent); }
.provider-item .drag-handle {
  cursor: grab; flex-shrink: 0; color: var(--text2); opacity: 0.2;
  font-size: 13px; padding: 0 2px; transition: opacity 0.15s;
}
.provider-item:hover .drag-handle { opacity: 0.6; }
.provider-item .drag-handle:active { cursor: grabbing; }

/* ─── 详情卡片 ─── */
.detail-empty { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 50px 20px; text-align: center; color: var(--text2); }
.detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: visible; }
.detail-header { padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; gap-wrap: wrap; }
.detail-header h2 { font-size: 15px; font-weight: 600; flex: 1; }
.type-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; background: var(--accent); color: #fff; }
.detail-body { padding: 14px 16px; }
.detail-actions { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }

/* ─── 表单 ─── */
.form-group { margin-bottom: 10px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.3px; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
input, select {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 10px; color: var(--text); font-size: 13px; outline: none; width: 100%; transition: border-color 0.15s;
}
input:focus, select:focus { border-color: var(--accent); }

/* ─── URL 链接/编辑切换 ─── */
.url-field { position: relative; }
.url-field .url-input {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 10px; color: var(--text); font-size: 13px; outline: none; width: 100%;
  transition: border-color 0.15s;
}
.url-field .url-input:focus { border-color: var(--accent); }
.url-field .url-display {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 10px; font-size: 13px; cursor: text; transition: border-color 0.15s;
}
.url-field .url-display:hover { border-color: var(--accent); }
.url-field .url-display .url-link {
  color: var(--accent); text-decoration: none; word-break: break-all;
}
.url-field .url-display .url-link:hover { text-decoration: underline; }
.url-field .url-display .url-placeholder { color: var(--text2); }
.url-field.editing .url-display { display: none; }
.url-field:not(.editing) .url-input { display: none; }
input.key-input { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

/* ─── 模型选择 ─── */
.model-select-area {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; margin-bottom: 10px;
}
.model-select-area .area-title { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.model-select-area .area-title .count { color: var(--accent); }
select.model-select { width: 100%; padding: 8px 10px; font-size: 13px; font-family: 'JetBrains Mono', monospace; }
input.model-input { width: 100%; padding: 8px 10px; font-size: 13px; font-family: 'JetBrains Mono', monospace; }

.combo-box { position: relative; }
.combo-box .model-input { padding-right: 30px; }
.combo-toggle {
  position: absolute; right: 0; top: 0; bottom: 0;
  width: 28px; border: none; background: #1e2235; color: var(--text2);
  cursor: pointer; font-size: 10px; border-radius: 0 6px 6px 0;
}
.combo-toggle:hover { color: var(--text1); background: var(--border); }
.combo-dropdown {
  display: none; position: absolute; top: 100%; left: 0; right: 0;
  background: #1e2235; border: 1px solid var(--border);
  border-radius: 6px; max-height: 300px; overflow-y: auto;
  z-index: 100; box-shadow: 0 6px 16px rgba(0,0,0,.5);
}
.combo-dropdown.open { display: block; }
.combo-item {
  padding: 7px 12px; font-size: 13px; font-family: 'JetBrains Mono', monospace;
  cursor: pointer; color: var(--text1);
}
.combo-item:hover, .combo-item.active { background: var(--accent); color: #fff; }

/* ─── 验证结果 ─── */
.validate-result {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; margin-bottom: 10px;
}
.validate-result .vr-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.validate-result .vr-label { font-size: 12px; color: var(--text2); margin-top: 8px; margin-bottom: 2px; }
.validate-result .vr-content { background: var(--surface3); border-radius: 4px; padding: 6px 10px; font-size: 13px; color: var(--text); max-height: 120px; overflow-y: auto; word-break: break-all; }
.validate-result .vr-usage { font-size: 12px; color: var(--text2); margin-top: 6px; }

/* ─── 测试中实时 Key 表格 ─── */
.live-key-table-wrap {
  margin: 10px 0 12px;
  background: var(--surface2);
  border-radius: 8px; border: 1px solid var(--border); overflow: hidden;
  padding: 10px 12px;
}
.live-key-table-wrap .lk-title {
  font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}
.live-key-table-wrap .lk-title .lk-spinner {
  width: 11px; height: 11px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.6s linear infinite;
  display: inline-block;
}
.live-key-table-wrap table {
  width: 100%; border-collapse: collapse; font-size: 12px;
  /* 给各列固定宽度 + 详情列宽，避免详情列被挤成 30+px 触发纵向换行导致行高虚高 */
  table-layout: fixed;
}
.live-key-table-wrap th {
  text-align: left; color: var(--text2); font-weight: 600;
  padding: 4px 6px; border-bottom: 1px solid var(--border);
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px;
  white-space: nowrap;
}
.live-key-table-wrap td {
  padding: 4px 6px; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.live-key-table-wrap tr:last-child td { border-bottom: none; }
/* 列宽分配：Key 30% / 状态 14% / 耗时 12% / 详情 32% / 操作 12% */
.live-key-table-wrap th:nth-child(1), .live-key-table-wrap td:nth-child(1) { width: 30%; }
.live-key-table-wrap th:nth-child(2), .live-key-table-wrap td:nth-child(2) { width: 14%; }
.live-key-table-wrap th:nth-child(3), .live-key-table-wrap td:nth-child(3) { width: 12%; }
.live-key-table-wrap th:nth-child(4), .live-key-table-wrap td:nth-child(4) { width: 32%; }
.live-key-table-wrap th:nth-child(5), .live-key-table-wrap td:nth-child(5) { width: 12%; }
.live-key-table-wrap .lk-key {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.live-key-table-wrap .lk-status { font-weight: 600; font-size: 12px; white-space: nowrap; }
.live-key-table-wrap .lk-status.pending { color: var(--text2); }
.live-key-table-wrap .lk-status.available { color: var(--green); }
.live-key-table-wrap .lk-status.cancelled { color: var(--orange); }
.live-key-table-wrap .lk-status.rate_limited { color: var(--orange); }
.live-key-table-wrap .lk-status.timeout { color: var(--orange); }
.live-key-table-wrap .lk-status.auth_error { color: var(--red); }
.live-key-table-wrap .lk-status.error { color: var(--red); }
.live-key-table-wrap .lk-elapsed { font-size: 12px; color: var(--text); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
.live-key-table-wrap .lk-detail {
  font-size: 11px; color: var(--text2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 0;  /* 配合 table-layout:fixed 让 ellipsis 在百分比列上生效 */
}
.live-key-table-wrap .lk-detail .lk-err { color: var(--red); }
.live-key-table-wrap .lk-stop {
  padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 500;
  background: #e74c3c22; color: var(--red); border: 1px solid #e74c3c44;
  cursor: pointer; transition: all 0.15s; line-height: 1.4; white-space: nowrap;
}
.live-key-table-wrap .lk-stop:hover:not(:disabled) { background: #e74c3c44; }
.live-key-table-wrap .lk-stop:disabled { opacity: 0.4; cursor: default; }
.live-key-table-wrap .lk-stop.btn-stopping {
  background: var(--surface3); color: var(--text2);
  border: 1px solid var(--border);
}

/* ─── 日志 ─── */
.log-panel { background: #0c0e14; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.log-header { padding: 8px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text2); flex-shrink: 0; }
.log-body { padding: 10px 14px; flex: 1; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.65; }
.log-body::-webkit-scrollbar { width: 5px; }
.log-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.log-entry { margin-bottom: 3px; }
.log-time { color: var(--text2); margin-right: 6px; }
.log-method { font-weight: 700; margin-right: 4px; }
.log-method.GET { color: var(--green); }
.log-method.POST { color: var(--blue); }
.log-url { color: var(--text); word-break: break-all; }
.log-status { font-weight: 700; margin-left: 6px; }
.log-status.s2xx { color: var(--green); }
.log-status.s4xx { color: var(--orange); }
.log-status.s5xx { color: var(--red); }
.log-status.s0 { color: var(--text2); }
.log-detail { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; margin: 4px 0 8px 20px; font-size: 11px; max-height: 240px; overflow: hidden; display: flex; flex-direction: column; }
.log-detail-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.log-detail-tab { padding: 4px 12px; font-size: 10.5px; font-weight: 600; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.log-detail-tab:hover { color: var(--text); }
.log-detail-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.log-detail-content { padding: 8px 12px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; color: var(--text2); flex: 1; }
.log-provider-tag { display: inline-block; background: var(--accent); color: #fff; font-size: 9.5px; padding: 1px 5px; border-radius: 3px; margin-right: 4px; font-weight: 500; }

.toast { position: fixed; bottom: 20px; right: 20px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.3s; z-index: 999; }
.toast.show { opacity: 1; }
.toast.success { background: #00cec933; color: var(--green); border: 1px solid #00cec944; }
.toast.error { background: #ff6b6b33; color: var(--red); border: 1px solid #ff6b6b44; }

.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) { .main-layout { flex-direction: column; } .list-panel { width: 100%; } }
</style>
</head>
<body>

<header>
  <h1><span>🔑</span> API Key Validator <span class="badge">v2.0</span></h1>
  <a class="github-link" href="https://github.com/steamcat1v5/api-key-validator" target="_blank" rel="noopener" title="GitHub 项目地址">

<script>
const API = '';
let providersData = [];
let selectedIdx = -1;
let logEntriesByProvider = {}; // name -> [entries]
let logTabStates = {}; // entryId -> 'request' | 'response'
let logEntryCounter = 0;
let validateResults = {}; // name -> result
let busy = false;
let busyProvider = null; // 正在验证/获取的 provider 名称
let busySet = new Set(); // 批量验证中尚未完成的 provider 集合
let dirtyMap = {}; // idx -> true (该 provider 有未保存的改动)

// ─── 智力测试题库 ─────────────────
// 标准答案 answer 用作裁判参考；裁判 LLM 会判断语义等价（如 "45" vs "40+一包5元零食"）
const QUIZ_BANK = [
  {
    id: 'Q1',
    title: '小明买零食',
    question: '小明到店里买一包5块钱零食，给了店员50块，店员找了45给他，小明收了钱后，然后小明说：我有5块零钱，我给你5块钱，叫店员把刚才的50块给回小明，店员给了50小明。\n\n请问小明赚了多少？\n店员亏了多少？',
    answer: '小明赚45元，店员亏45元'
  },
  {
    id: 'Q2',
    title: '色盲遗传问题',
    question: '有一天，一个女孩参加数学考试只得了 38 分。她心里对父亲的惩罚充满恐惧，于是偷偷把分数改成了 88 分。她的父亲看到试卷后，怒发冲冠，狠狠地给了她巴掌，怒吼道："你这 8 怎么一半是绿的一半是红的，你以为我是傻子吗？" 女孩被打后，委屈地哭了起来，什么也没说。\n\n过了一会儿，父亲突然崩溃了。\n\n请问：这位父亲为什么过一会儿崩溃了？他意识到了什么？\n提示：这是逻辑推理题，而非情感题目。',
    answer: '父亲意识到女儿不是亲生的。女孩改分时用了与原笔不同颜色的笔却看不出来，说明她是红绿色盲；红绿色盲是X染色体隐性遗传，女儿色盲意味着两个X都带色盲基因，其中一个必须来自父亲——但父亲能看出绿红差异说明他不色盲，矛盾证明他不是生父。'
  },
  {
    id: 'Q3',
    title: '洗车问题',
    question: '我想去洗车，洗车店距离我家只有大约50米（或100米），你说我应该开车过去还是走路过去？',
    answer: '开车过去。因为要洗的是车，车必须到洗车店才行，人走过去车还留在家里根本没法洗。不管距离多近，车不能自己走过去，必须开过去（或推过去）。'
  },
];

// 智力测试状态（localStorage 持久化）
let quizSelectedId = '';      // 选中的题目 id
let quizJudgeProvider = '';   // 裁判 provider 名称

// ─── 快照 & 脏检测 ─────────────────
const SAVE_FIELDS = ['name', 'type', 'base_url', 'api_keys', 'source_url', 'selected_model', 'timeout', 'extra_headers'];

function takeSnapshot(p) {
  const snap = {};
  for (const f of SAVE_FIELDS) snap[f] = JSON.stringify(p[f] || (f === 'api_keys' ? [] : ''));
  return snap;
}

function isDirty(i) {
  const p = providersData[i];
  if (!p) return false;
  return dirtyMap[i] === true;
}

function checkDirty(i) {
  const p = providersData[i];
  if (!p) { delete dirtyMap[i]; return false; }
  // 新增的 provider（名称为空）直接标记为 dirty
  if (!p.name) { dirtyMap[i] = true; return true; }
  const snap = p._snapshot;
  if (!snap) { dirtyMap[i] = true; return true; }
  let changed = false;
  for (const f of SAVE_FIELDS) {
    const cur = JSON.stringify(p[f] || (f === 'api_keys' ? [] : ''));
    if (cur !== snap[f]) { changed = true; break; }
  }
  if (changed) dirtyMap[i] = true; else delete dirtyMap[i];
  return changed;
}

async function init() {
  // 恢复 stream 勾选状态
  const chk = document.getElementById('chkStream');
  const resp = await fetch(`${API}/api/config`);
  const data = await resp.json();
  if (chk && data.stream) chk.checked = true;
  providersData = data.providers || [];
  // 从 config 恢复每个 provider 的最近验证状态到 validateResults
  providersData.forEach(p => {
    if (p.last_status && typeof p.last_status === 'object') {
      const ls = p.last_status;
      validateResults[p.name] = {
        status: ls.status || 'error',
        model: ls.model || p.selected_model || '',
        content: ls.content || null,
        elapsed: ls.elapsed != null ? ls.elapsed : null,
        error: ls.error || null,
        usage: ls.usage || null,
        multi_results: ls.multi_results || null,
      };
      delete p.last_status; // 清理临时字段，避免脏检测干扰
    }
  });
  // 给每个 provider 存快照用于脏检测（在删除 last_status 之后）
  providersData.forEach(p => { p._snapshot = takeSnapshot(p); });
  // 恢复上次选中的 provider
  if (data.selected_idx >= 0 && data.selected_idx < providersData.length) {
    selectedIdx = data.selected_idx;
  } else if (providersData.length > 0) {
    selectedIdx = 0;
  }
  // 恢复正在进行的验证状态（刷新页面后）
  const runningValidations = data.running_validations || {};
  for (const [rname, runningKeyIndices] of Object.entries(runningValidations)) {
    const p = providersData.find(x => x.name === rname);
    if (!p || !p.api_keys || p.api_keys.length === 0) continue;
    // 构建 key 列表（从 provider 的 api_keys 取预览）
    const keys = p.api_keys.map((ak, i) => ({
      key_index: i,
      key_preview: ak.length > 12 ? ak.slice(0, 8) + '...' + ak.slice(-4) : ak
    }));
    // 显示骨架表格（测试中状态）
    renderLiveKeyTableSkeleton(rname, keys);
    // 标记 busy
    busySet.add(rname);
    // 开始轮询已完成的结果
    pollRunningStatus(rname);
  }
  renderAll();
  // 加载初始 provider 的日志
  if (selectedIdx >= 0 && providersData[selectedIdx]) {
    await loadProviderLogs(providersData[selectedIdx].name);
  }
  // 恢复智力测试设置
  loadQuizSetting();
}

function renderAll() { renderList(); renderDetail(); }

// ─── 列表 ─────────────────
function renderList() {
  const el = document.getElementById('providerList');
  if (providersData.length === 0) {
    el.innerHTML = '<div style="text-align:center;color:var(--text2);padding:16px;font-size:12px">暂无 Provider<br>点击「➕ 添加」</div>';
    return;
  }
  el.innerHTML = providersData.map((p, i) => {
    const r = validateResults[p.name];
    const dotClass = r ? (r.status || 'idle') : (p.selected_model ? 'idle' : 'no_model');
    const modelInfo = p.models && p.models.length ? `${p.models.length} 模型` : '未获取';
    return `<div class="provider-item ${i === selectedIdx ? 'active' : ''}" data-idx="${i}" draggable="true"
        ondragstart="onDragStart(event,${i})" ondragover="onDragOver(event,${i})" ondragleave="onDragLeave(event)" ondrop="onDrop(event,${i})" ondragend="onDragEnd(event)"
        onclick="selectProvider(${i})">
      <span class="drag-handle" title="拖拽排序">⠿</span>
      <span class="dot ${dotClass}"></span>
      <span class="p-name">${esc(p.name || '未命名')}</span>
      <span class="p-status">${modelInfo}</span>
      <span class="p-type">${p.type || 'openai'}</span>
      <span class="p-actions">
        <button class="btn-clone-item" onclick="event.stopPropagation(); cloneProvider(${i})" title="克隆此 provider（不复制 API key）">⧉</button>
        <button class="btn-del-item" onclick="event.stopPropagation(); rmProvider(${i})" title="删除">✕</button>
      </span>
    </div>`;
  }).join('');
}

// ─── 详情 ─────────────────
function renderDetail() {
  const el = document.getElementById('detailContent');
  if (selectedIdx < 0 || selectedIdx >= providersData.length) {
    el.innerHTML = '<div class="detail-empty"><p>👈 选择或添加一个 Provider</p></div>';
    return;
  }
  const p = providersData[selectedIdx];
  const r = validateResults[p.name];
  const hasModels = p.models && p.models.length > 0;
  const stream = document.getElementById('chkStream').checked;

  // 模型选择区
  const currentModel = p.selected_model || '';
  const modelInputValue = esc(currentModel);
  const modelName = esc(p.name);
  const hasOptions = p.models && p.models.length > 0;
  const modelHint = hasModels
    ? `已获取 <span class="count">${p.models.length}</span> 个模型`
    : '输入模型名或点击「📡 获取模型」';

  let modelArea = `<div class="model-select-area">
    <div class="area-title">${modelHint}</div>
    <div class="combo-box" id="combo-${selectedIdx}">
      <input class="model-input" id="model-input-${selectedIdx}" value="${modelInputValue}"
        onchange="onModelInput('${modelName}', this.value)"
        oninput="filterCombo(${selectedIdx}, this.value)"
        onkeydown="comboKeydown(${selectedIdx}, event, '${modelName}')"
        onblur="setTimeout(()=>closeCombo(${selectedIdx}),150)"
        placeholder="输入或搜索模型名称"
        onfocus="openCombo(${selectedIdx})">
      <button class="combo-toggle" onclick="toggleCombo(${selectedIdx})" tabindex="-1">▼</button>
      ${hasOptions ? `<div class="combo-dropdown" id="dropdown-${selectedIdx}"></div>` : ''}
    </div>
  </div>`;

  // 验证结果
  let resultArea = '';
  if (r) {
    const statusLabel = {available:'✅ 可用',rate_limited:'⚠️ 限速',auth_error:'❌ 鉴权失败',not_supported:'❌ 模型不支持',timeout:'⏱ 超时',error:'⚠️ 错误',no_model:'⚠️ 未选模型',mixed:'🔄 混合'}[r.status]||r.status;
    const statusColor = r.status === 'available' ? 'var(--green)' : (r.status === 'rate_limited' || r.status === 'mixed' ? 'var(--orange)' : 'var(--red)');
    
    // 多 key 结果表格 — 已迁移到 renderLiveKeyTableHTML 统一管理（测试中和测试后共用一张表）
    // 这里不再独立渲染 multiArea，避免重复
    let multiArea = '';
    
    resultArea = `<div class="validate-result">
      <div class="vr-row">
        <span class="dot ${r.status}" style="width:9px;height:9px"></span>
        <strong style="color:${statusColor}">${statusLabel}</strong>
        ${r.model ? `<span style="font-size:12px;color:var(--text2);margin-left:4px">${esc(r.model)}</span>` : ''}
        ${r.error && (!r.multi_results || r.multi_results.length <= 1) ? `<span style="font-size:12px;color:var(--red);margin-left:4px">${esc(r.error)}</span>` : ''}
      </div>
      ${r.content && (!r.multi_results || r.multi_results.length <= 1) ? (() => {
        // 单 key 或无 key 场景：在回复内容下方显示评分结果（✓对/✗错/评分中）
        let badge = '';
        const qr = (r.multi_results && r.multi_results[0]) ? r.multi_results[0] : r;
        if (qr.quiz_correct === true) {
          badge = `<div style="margin-top:8px;padding:6px 12px;background:var(--green-bg,rgba(40,200,100,.1));border-radius:6px"><span style="color:var(--green);font-weight:600;font-size:14px">✓ 回答正确</span>${qr.quiz_reason ? ` <span style="color:var(--text2);font-size:12px">${esc(qr.quiz_reason.slice(0, 120))}</span>` : ''}</div>`;
        } else if (qr.quiz_correct === false) {
          badge = `<div style="margin-top:8px;padding:6px 12px;background:rgba(231,76,60,.1);border-radius:6px"><span style="color:var(--red);font-weight:600;font-size:14px">✗ 回答错误</span>${qr.quiz_reason ? ` <span style="color:var(--text2);font-size:12px">${esc(qr.quiz_reason.slice(0, 120))}</span>` : ''}</div>`;
        } else if (qr.quiz_correct === 'pending' || qr.quiz_reason === 'pending') {
          badge = `<div style="margin-top:8px;padding:6px 12px;background:var(--surface2);border-radius:6px"><span style="color:var(--text2)">⏳ 评分中...</span></div>`;
        } else if (qr.quiz_correct == null && qr.quiz_reason) {
          badge = `<div style="margin-top:8px;padding:6px 12px;background:rgba(243,156,18,.1);border-radius:6px"><span style="color:var(--orange);font-weight:600;font-size:14px">⚠ 评分失败</span> <span style="color:var(--text2);font-size:12px">${esc(qr.quiz_reason.slice(0, 120))}</span></div>`;
        }
        return `<div class="vr-label">回复内容</div><div class="vr-content">${esc(r.content)}</div>${badge}`;
      })() : ''}
      ${multiArea}
      <div class="vr-usage">
        ${r.usage && (r.usage.prompt_tokens || r.usage.completion_tokens) ? `📊 tokens: prompt=${r.usage.prompt_tokens||'?'} completion=${r.usage.completion_tokens||'?'}` : ''}
        ${r.elapsed != null ? `<span style="float:right">⏱${r.elapsed.toFixed(2)}s</span>` : ''}
      </div>
    </div>`;
  }

  // 测试中实时表格：若当前 provider 有 live 状态则渲染在 resultArea 之后
  const liveArea = renderLiveKeyTableHTML(p.name);

  el.innerHTML = `<div class="detail-card">
    <div class="detail-header">
      <span class="dot ${r ? r.status : (p.selected_model ? 'idle' : 'no_model')}" style="width:8px;height:8px"></span>
      <h2>${esc(p.name || '未命名')}</h2>
      <span class="type-badge">${p.type || 'openai'}</span>
      <button class="btn ${isDirty(selectedIdx) ? 'btn-save' : 'btn-secondary'}" style="font-size:12px;padding:4px 10px" ${isDirty(selectedIdx) ? '' : 'disabled'} onclick="saveProvider(${selectedIdx})">${isDirty(selectedIdx) ? '💾 保存' : '💾 已保存'}</button>
    </div>
    <div class="detail-body">
      <div class="form-group">
        <label>名称</label>
        <input value="${esc(p.name||'')}" onchange="updField(${selectedIdx},'name',this.value)">
      </div>
      <div class="form-group">
        <label>来源网址</label>
        <div class="url-field" id="source-url-wrap-${selectedIdx}">
          <div class="url-display" onclick="enterUrlEdit(${selectedIdx})">
            ${p.source_url
              ? `<a class="url-link" href="${esc(p.source_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(p.source_url)}</a>`
              : `<span class="url-placeholder">点击编辑</span>`}
          </div>
          <input class="url-input" id="source-url-input-${selectedIdx}" value="${esc(p.source_url||'')}"
             onchange="onUrlChange(${selectedIdx}, this.value)"
             onblur="onUrlChange(${selectedIdx}, this.value)"
             onkeydown="if(event.key==='Escape'){this.blur()}"
             placeholder="https://example.com/get-api">
        </div>
      </div>
      <div class="form-group">
        <label>Base URL</label>
        <input value="${esc(p.base_url||'')}" onchange="updField(${selectedIdx},'base_url',this.value)">
      </div>
      <div class="form-group">
        <label>协议</label>
        <select onchange="updField(${selectedIdx},'type',this.value)">
          <option value="openai" ${p.type==='openai'?'selected':''}>OpenAI 协议</option>
          <option value="anthropic" ${p.type==='anthropic'?'selected':''}>Anthropic 协议</option>
        </select>
      </div>
      <div class="form-group">
        <details id="headersDetails-${selectedIdx}" style="margin-top:0;${p.extra_headers && Object.keys(p.extra_headers).length > 0 ? '' : ''}">
          <summary style="cursor:pointer;font-size:13px;color:var(--text-muted);user-select:none;padding:2px 0">🔻 HTTP Header 覆盖（可选）</summary>
          <textarea id="headersInput-${selectedIdx}" rows="3" style="width:100%;min-height:60px;max-height:200px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.4;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);outline:none;resize:vertical"
            placeholder="每行一个 header，key 和 value 用空格分隔，例：&#10;x-client-type cline-cli&#10;X-Custom-Value hello"
            oninput="updateExtraHeaders(${selectedIdx},this.value)"></textarea>
        </details>
      </div>
      <div class="form-group">
        <label>API Key ${(() => { const ks = p.api_keys||[]; return ks.length > 1 ? `(${ks.length} 个)` : ''; })()}</label>
        <div style="display:flex;gap:6px;align-items:flex-start">
          <textarea class="key-input" style="flex:1;min-height:35px;${(p.api_keys||[]).length > 1 ? 'height:120px;' : ''}max-height:120px;resize:vertical;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.4;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);outline:none;width:100%" 
            onchange="updField(${selectedIdx},'api_keys',this.value.split(String.fromCharCode(10)).map(k=>k.trim()).filter(k=>k))"
            onfocus="this.value=keysToText(providersData[${selectedIdx}].api_keys)"
            onblur="this.value=maskMultiKey(keysToText(providersData[${selectedIdx}].api_keys))"
            placeholder="sk-xxx / tp-xxx  (多个 key 换行分隔，每行一个)">${esc(maskMultiKey(keysToText(p.api_keys)))}</textarea>
          <button class="btn btn-secondary" style="flex-shrink:0;padding:6px 8px;font-size:12px" onclick="copyKey('${esc(p.name)}')" title="复制完整 Key(s)">📋</button>
        </div>
      </div>
      ${modelArea}
      ${resultArea}
      ${liveArea}
    </div>
    <div class="detail-actions">
      <button class="btn btn-fetch" onclick="fetchModels('${esc(p.name)}')" ${busySet.has(p.name) ?'disabled':''}>📡 获取模型</button>
      <button class="btn btn-primary" onclick="validateSingle('${esc(p.name)}')" ${busySet.has(p.name) || !p.selected_model ? 'disabled' : ''}>🔍 验证</button>
      <button class="btn btn-primary" onclick="validateSingle('${esc(p.name)}', true)" ${busySet.has(p.name) || !p.selected_model ? 'disabled' : ''} style="${quizSelectedId ? 'background:var(--accent2)' : ''}">🧠 智测</button>
      <select style="width:auto;margin-left:auto;padding:6px 8px;font-size:13px;color:var(--text2);align-self:center;background:var(--surface2);border:1px solid var(--border);border-radius:6px;outline:none;cursor:pointer" onchange="updField(${selectedIdx},'timeout',parseInt(this.value));renderDetail()">${[30,60,120,300].map(t => `<option value="${t}" ${t===(p.timeout||60)?'selected':''}>超时: ${t}s</option>`).join('')}</select>
    </div>
  </div>`;
  // DOM 已插入后立刻 tick 一次，避免切走再切回时短暂停留在「0s」错值
  if (liveArea && typeof tickPendingRows === 'function') {
    tickPendingRows();
    // 如果切走期间 ticker 被自动停了，切回发现有 pending 就重启 ticker 持续计时
    if (!pendingTickerId && document.querySelector('.lk-status.pending[data-started-at]')) {
      startPendingTicker();
    }
  }
  // 回填 HTTP Header 覆盖文本框
  fillExtraHeaders(selectedIdx);
}

function esc(s) { return (s||'').replace(/&/g,'&').replace(/"/g,'"').replace(/</g,'<').replace(/>/g,'>'); }

// ─── Combo-box 控制 ─────────────────
function toggleCombo(idx) {
  const dd = document.getElementById(`dropdown-${idx}`);
  if (!dd) return;
  if (dd.classList.contains('open')) closeCombo(idx);
  else openCombo(idx);
}

function renderComboItems(idx, filter) {
  const dd = document.getElementById(`dropdown-${idx}`);
  if (!dd) return;
  const p = providersData[idx];
  if (!p || !p.models || p.models.length === 0) return;
  const modelName = esc(p.name);
  const q = (filter || '').toLowerCase().trim();
  const filtered = q
    ? p.models.filter(m => m.toLowerCase().includes(q))
    : p.models;
  // 限制最多显示 100 条避免卡顿
  const limited = filtered.slice(0, 100);
  const hint = filtered.length > limited.length
    ? `<div style="padding:4px 8px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border)">显示 ${limited.length}/${filtered.length} 个匹配</div>`
    : (q && filtered.length === 0 ? '<div style="padding:8px;font-size:12px;color:var(--text2)">无匹配模型</div>' : '');
  dd.innerHTML = hint + limited.map(m =>
    `<div class="combo-item" onmousedown="pickCombo(${idx},'${esc(m)}','${modelName}')">${esc(m)}</div>`
  ).join('');
}

function filterCombo(idx, value) {
  // 实时过滤
  if (!document.getElementById(`dropdown-${idx}`)) return;
  document.getElementById(`dropdown-${idx}`).classList.add('open');
  renderComboItems(idx, value);
  // 过滤后默认选中第一项
  const dd = document.getElementById(`dropdown-${idx}`);
  if (dd) {
    const first = dd.querySelector('.combo-item');
    if (first) first.classList.add('active');
  }
}

function openCombo(idx) {
  const dd = document.getElementById(`dropdown-${idx}`);
  if (!dd) return;
  dd.classList.add('open');
  // 渲染全部模型（无过滤）或按当前输入过滤
  const input = document.getElementById(`model-input-${idx}`);
  renderComboItems(idx, input ? input.value : '');
}

function comboKeydown(idx, e, name) {
  const dd = document.getElementById(`dropdown-${idx}`);
  if (!dd || !dd.classList.contains('open')) return;
  const items = dd.querySelectorAll('.combo-item');
  if (items.length === 0) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    let cur = dd.querySelector('.combo-item.active');
    let next = cur ? cur.nextElementSibling : items[0];
    // 跳过非 combo-item 的提示元素
    while (next && !next.classList.contains('combo-item')) next = next.nextElementSibling;
    if (!next) next = items[0];
    if (cur) cur.classList.remove('active');
    next.classList.add('active');
    next.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    let cur = dd.querySelector('.combo-item.active');
    let prev = cur ? cur.previousElementSibling : items[items.length - 1];
    while (prev && !prev.classList.contains('combo-item')) prev = prev.previousElementSibling;
    if (!prev) prev = items[items.length - 1];
    if (cur) cur.classList.remove('active');
    prev.classList.add('active');
    prev.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const cur = dd.querySelector('.combo-item.active');
    if (cur) {
      const model = cur.textContent;
      pickCombo(idx, model, name);
    }
  } else if (e.key === 'Escape') {
    e.preventDefault();
    closeCombo(idx);
  }
}

function closeCombo(idx) {
  const dd = document.getElementById(`dropdown-${idx}`);
  if (dd) dd.classList.remove('open');
}

function pickCombo(idx, model, name) {
  const input = document.getElementById(`model-input-${idx}`);
  if (input) input.value = model;
  onModelInput(name, model);
  closeCombo(idx);
}

// ─── 拖拽排序 ─────────────────
let dragIdx = null;

function onDragStart(e, i) {
  dragIdx = i;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  // Firefox 需要 setData 才能触发拖拽
  try { e.dataTransfer.setData('text/plain', String(i)); } catch(_) {}
}

function onDragOver(e, i) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (dragIdx === null || dragIdx === i) return;
  const el = e.currentTarget;
  el.classList.remove('drag-over-top', 'drag-over-bottom');
  // 判断鼠标位置在上半还是下半
  const rect = el.getBoundingClientRect();
  const mid = rect.top + rect.height / 2;
  if (e.clientY < mid) el.classList.add('drag-over-top');
  else el.classList.add('drag-over-bottom');
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
}

async function onDrop(e, i) {
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
  if (dragIdx === null || dragIdx === i) return;
  // 判断插入位置（上半=前，下半=后）
  const rect = e.currentTarget.getBoundingClientRect();
  const insertAfter = e.clientY >= rect.top + rect.height / 2;
  const from = dragIdx;
  // 从原位置移除
  const [moved] = providersData.splice(from, 1);
  // 计算目标位置（移除后 index 偏移）
  let target = i;
  if (from < i) target = i - 1;
  if (insertAfter) target += 1;
  providersData.splice(target, 0, moved);
  // 更新 selectedIdx
  if (from === selectedIdx) selectedIdx = target;
  else if (from < selectedIdx && target >= selectedIdx) selectedIdx--;
  else if (from > selectedIdx && target <= selectedIdx) selectedIdx++;
  dragIdx = null;
  renderAll();
  await saveConfig(true);
}

function onDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(el => {
    el.classList.remove('drag-over-top', 'drag-over-bottom');
  });
  dragIdx = null;
}

async function selectProvider(i) {

async function loadProviderLogs(name) {
  if (!name) return;
  // 如果已经有缓存的日志，直接刷新显示
  if (logEntriesByProvider[name]) { renderLog(); return; }
  try {
    const resp = await fetch(`${API}/api/logs?name=${encodeURIComponent(name)}`);
    const data = await resp.json();
    const entries = (data.entries || []).map(e => {
      const entryId = ++logEntryCounter;
      logTabStates[entryId] = 'response';
      return { id: entryId, ...e };
    });
    logEntriesByProvider[name] = entries;
    // 只有当前选中的 provider 才刷新显示
    const currentP = providersData[selectedIdx];
    if (currentP && currentP.name === name) renderLog();

function addProvider() {
  providersData.push({ name: '', type: 'openai', base_url: '', api_keys: [], models: [], selected_model: '', source_url: '', timeout: 60, extra_headers: {} });
  selectedIdx = providersData.length - 1;
  // 新增 provider 没有快照，checkDirty 会自动标记为 dirty
  checkDirty(selectedIdx);
  renderAll();

async function rmProvider(i) {
  const name = providersData[i].name || '未命名';
  if (!confirm(`确定要删除 Provider「${name}」吗？`)) return;
  try {
    const resp = await fetch(`${API}/api/delete-provider`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ idx: i })
    });
    const data = await resp.json();
    if (data.ok) {
      providersData.splice(i, 1);
      // 重建 dirtyMap（splice 后索引偏移）
      const newDirty = {};
      for (const [k, v] of Object.entries(dirtyMap)) {
        const ki = parseInt(k);
        if (ki < i) newDirty[ki] = v;
        else if (ki > i) newDirty[ki - 1] = v;
      }
      dirtyMap = newDirty;
      if (validateResults[name]) delete validateResults[name];
      selectedIdx = data.selected_idx >= 0 ? data.selected_idx : (providersData.length > 0 ? providersData.length - 1 : -1);
      showToast(`🗑️ 已删除「${name}」`, 'success');
    } else {
      showToast(`❌ 删除失败: ${data.error}`, 'error');
    }
  } catch(e) { showToast('❌ 请求失败: ' + e.message, 'error'); }
  renderAll();
}

// 克隆 provider：复制除 api_keys 外所有字段，插入到原位置之后
// 名称后加短 uuid 后缀避免重复（同基础名连续克隆多次时也唯一）
function cloneProvider(i) {
  const src = providersData[i];
  if (!src) return;
  // 生成 6 位短 uuid（base36）—— 36^6 ≈ 21亿，足够避免重复
  const shortId = Math.random().toString(36).slice(2, 8);
  const clone = {
    name: `${src.name || '未命名'}_${shortId}`,
    type: src.type || 'openai',
    base_url: src.base_url || '',
    // api_keys 不复制——克隆出的 provider 默认没 key
    api_keys: [],
    models: Array.isArray(src.models) ? [...src.models] : [],
    selected_model: src.selected_model || '',
    source_url: src.source_url || '',
    timeout: src.timeout || 60,
    // _snapshot 留空：克隆出的 provider 自然是 dirty 状态
  };
  // 插入到 i 之后
  providersData.splice(i + 1, 0, clone);
  // 重建 dirtyMap：i 之前保留，i+1 标 dirty，i+1 及之后的索引 +1
  const newDirty = {};
  for (const [k, v] of Object.entries(dirtyMap)) {
    const ki = parseInt(k);
    if (ki <= i) newDirty[ki] = v;
    else newDirty[ki + 1] = v;
  }
  newDirty[i + 1] = true; // 克隆的 provider 标 dirty
  dirtyMap = newDirty;
  // 选中克隆出的新 provider 方便编辑
  selectedIdx = i + 1;
  checkDirty(selectedIdx);
  renderAll();
  showToast(`📋 已克隆「${src.name || '未命名'}」→「${clone.name}」`, 'success');
}
function updField(i, k, v) {
  if (k === 'name' && providersData[i].name && providersData[i].name !== v) {
    if (validateResults[providersData[i].name]) {
      validateResults[v] = validateResults[providersData[i].name];
      delete validateResults[providersData[i].name];
    }
  }
  providersData[i][k] = v;
  checkDirty(i);
  if (k === 'name') renderList();
  renderDetail(); // 更新保存按钮状态
}

// 解析 HTTP Header 覆盖文本框：每行 "key value" → {key: value}
function parseExtraHeaders(text) {
  const obj = {};
  for (const line of text.split('\n')) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    const spaceIdx = trimmed.indexOf(' ');
    if (spaceIdx < 0) continue; // 没空格的行跳过
    const key = trimmed.slice(0, spaceIdx).trim();
    const value = trimmed.slice(spaceIdx + 1).trim();
    if (key) obj[key] = value;
  }
  return obj;
}
// 将 extra_headers 对象序列化回文本框格式
function formatExtraHeaders(obj) {
  if (!obj || typeof obj !== 'object') return '';
  return Object.entries(obj).map(([k, v]) => `${k} ${v}`).join('\n');
}
function updateExtraHeaders(i, text) {
  providersData[i].extra_headers = parseExtraHeaders(text);
  checkDirty(i);
  // 只更新保存按钮状态，不调 renderDetail 避免 textarea 失焦
  const btn = document.querySelector(`#detailContent .btn-save, #detailContent button[onclick^="saveProvider"]`);
  if (btn) {
    const dirty = isDirty(i);
    btn.disabled = !dirty;
    btn.textContent = dirty ? '💾 保存' : '💾 已保存';
    btn.className = `btn ${dirty ? 'btn-save' : 'btn-secondary'}`;
  }
  // 也更新列表项的 dirty 圆点
  renderList();
}
function fillExtraHeaders(idx) {
  const ta = document.getElementById(`headersInput-${idx}`);
  if (ta) {
    ta.value = formatExtraHeaders(providersData[idx]?.extra_headers);
  }
}

// ─── 保存配置 ─────────────────
async function saveProvider(i) {
  const p = providersData[i];
  if (!p) return;
  // 先保存全部（后端是全量保存），然后更新该 provider 的快照
  const payload = {
    providers: providersData.map(pp => ({
      name: pp.name, type: pp.type||'openai', base_url: pp.base_url,
      api_keys: pp.api_keys||[], models: pp.models||[], selected_model: pp.selected_model||'',
      source_url: pp.source_url||'', timeout: pp.timeout||60,
      extra_headers: pp.extra_headers||{}
    })),
    selected_idx: selectedIdx
  };
  try {
    const resp = await fetch(`${API}/api/config`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await resp.json();
    if (data.ok) {
      p._snapshot = takeSnapshot(p);
      delete dirtyMap[i];
      renderAll();
      showToast(`✅ 「${p.name || '未命名'}」已保存`, 'success');
    } else {
      showToast('❌ 保存失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch(e) {
    showToast('❌ 保存请求失败: ' + e.message, 'error');
  }
}

async function saveConfig(silent) {
  const payload = {
    providers: providersData.map(p => ({
      name: p.name, type: p.type||'openai', base_url: p.base_url,
      api_keys: p.api_keys||[], models: p.models||[], selected_model: p.selected_model||'',
      source_url: p.source_url||'', timeout: p.timeout||60,
      extra_headers: p.extra_headers||{}
    })),
    selected_idx: selectedIdx
  };
  try {
    const resp = await fetch(`${API}/api/config`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await resp.json();
    if (data.ok) {
      // 更新所有快照，清空 dirty
      providersData.forEach(p => { p._snapshot = takeSnapshot(p); });
      dirtyMap = {};
      renderAll();
      if (!silent) showToast('✅ 全部配置已保存', 'success');
    } else {
      showToast('❌ 保存失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch(e) {
    showToast('❌ 保存请求失败: ' + e.message, 'error');
  }
}

// ─── 获取模型列表 ─────────────────
async function fetchModels(name) {
  busySet.add(name); renderAll();
  try {
    // 把 provider 完整信息一起传过去，这样新增未保存的也能获取模型
    const p = providersData.find(x => x.name === name);
    const payload = p ? { name, base_url: p.base_url, api_keys: p.api_keys, type: p.type || 'openai', extra_headers: p.extra_headers || {} } : { name };
    const resp = await fetch(`${API}/api/fetch-models`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await resp.json();
    if (data.logs) data.logs.forEach(l => addLogEntry(l));
    if (data.ok) {
      if (p) { p.models = data.models; p.selected_model = data.selected_model; }
      showToast(`📡 ${name}: 获取到 ${data.models.length} 个模型`, 'success');
    } else {
      showToast(`❌ ${name}: ${data.error}`, 'error');
    }
    renderAll();
  } catch(e) { showToast('❌ 请求失败: ' + e.message, 'error'); }
  busySet.delete(name); renderAll();
}

async function fetchAllModels() {
  setBusy(true);
  try {
    const resp = await fetch(`${API}/api/fetch-all-models`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({}) });
    const data = await resp.json();
    if (data.logs) data.logs.forEach(l => addLogEntry(l));
    data.results.forEach(r => {
      if (r.ok) {
        const p = providersData.find(x => x.name === r.name);
        if (p) { p.models = r.models; p.selected_model = r.selected_model; }
      }
    });
    showToast(`📡 批量获取完成`, 'success');
    renderAll();
  } catch(e) { showToast('❌ 请求失败: ' + e.message, 'error'); }
  setBusy(false);
}

function onModelInput(name, value) {
  const model = (value || '').trim();
  if (!model) return;
  const p = providersData.find(x => x.name === name);
  if (p && p.selected_model !== model) {
    p.selected_model = model;
    const idx = providersData.indexOf(p);
    checkDirty(idx);
    renderAll();
  }
}

// ─── 验证 ─────────────────
// 测试中实时 Key 表格渲染状态：{ [name]: { keys: [...], results: {key_index: result} } }
let liveKeyTableMap = {};

// 状态符号与文案映射（与最终固化表格保持一致的语义）
const KEY_STATUS_SYMBOL = {
  available: '✅ 已可用',
  auth_error: '❌ 认证失败',
  rate_limited: '⚠️ 限速',
  timeout: '⏱ 超时',
  cancelled: '⏹ 已停止',
  error: '⚠️ 错误',
  not_supported: '❌ 模型不支持',
};

function cssEscape(s) {
  // 仅用于构造 id，避免特殊字符破坏选择器；这里用encodeURIComponent 后去掉不安全字符
  return encodeURIComponent(String(s || '')).replace(/[!'()*]/g, function (c) {
    return '%' + c.charCodeAt(0).toString(16);
  });
}

// 生成当前 provider 的多 key 表格 HTML，供 renderDetail 调用。
// 同一个表格在测试中和测试结束后都使用，避免「重新开表格」的视觉跳变。
// - 数据优先级: liveKeyTableMap[name].results（测试中，含正在进行的）→ validateResults[name].multi_results（固化结果）
// - 测试中: 显示 spinner + 「停止」按钮
// - 已完成: 标题改为「多 Key 验证结果」，操作列填「已完成/已停止」(disabled)
function renderLiveKeyTableHTML(name) {
  const entry = liveKeyTableMap[name];
  const multi = validateResults[name]?.multi_results;
  // 没有任何多 key 数据 → 不渲染（单 key 也通过这个表格展示评分结果）
  if (!entry && (!multi || multi.length < 1)) return '';

  // 测试中用 entry.keys 顺序（含未完成骨架），已结束用 multi 的固化结果
  const isPlaying = !!entry;
  const keys = isPlaying ? entry.keys : multi.map(m => ({ key_index: m.key_index, key_preview: m.key_preview }));
  const results = isPlaying ? entry.results : Object.fromEntries(multi.map(m => [m.key_index, m]));
  const total = keys.length;
  const escName = esc(name);
  if (total < 1) return ''; // 防御

  const doneCnt = Object.keys(results).length;
  const remaining = Math.max(0, total - doneCnt);
  const spinnerHTML = (isPlaying && remaining > 0) ? '<span class="lk-spinner"></span> ' : '';
  const titleText = isPlaying
    ? `测试中实时状态 (${total} 个 Key · ${doneCnt}/${total} 完成)`
    : `多 Key 验证结果 (${total} 个)`;

  const rows = keys.map(k => {
    const result = results[k.key_index];
    const rowId = `keyrow-${cssEscape(name)}-${k.key_index}`;
    if (!result) {
      // 骨架行（只有测试中才看到）— 状态文本由 lk-pending-ticker 每秒更新秒数
      // 初值在这里直接算出，避免 renderDetail 重新渲染后短暂显示「0s」错值
      const elapsedSec = Math.max(0, Math.floor((Date.now() - (entry?.startedAt || Date.now())) / 1000));
      return `<tr id="${rowId}" data-name="${escName}" data-key-idx="${k.key_index}">
        <td class="lk-key">${esc(k.key_preview || '')}</td>
        <td class="lk-status pending" data-started-at="${entry?.startedAt || Date.now()}">⏳ 测试中... ${elapsedSec}s</td>
        <td class="lk-elapsed">-</td>
        <td class="lk-detail"></td>
        <td><button class="lk-stop" onclick="cancelKey('${escName}', ${k.key_index}, this)">⏹ 停止</button></td>
      </tr>`;
    }
    const statusVal = result.status || 'error';
    const statusLabel = KEY_STATUS_SYMBOL[statusVal] || statusVal;
    const elapsedStr = (result.elapsed != null) ? result.elapsed.toFixed(1) + 's' : '-';
    let detailStr = '';
    if (result.error) {
      // 错误时把耗时拼到末尾，让用户一眼看到「Server disconnected」经历了多久
      const errWithElapsed = result.elapsed != null
        ? `${result.error.slice(0, 50)} (${elapsedStr})`
        : result.error.slice(0, 60);
      detailStr = `<span class="lk-err">${esc(errWithElapsed)}</span>`;
    } else if (result.content) {
      detailStr = esc(String(result.content).slice(0, 60));
    }
    // 智力测试结果叠加在 detailStr 上
    let quizBadge = '';
    if (result.quiz_correct === true) {
      quizBadge = ` <span style="color:var(--green);font-weight:600">✓ 对</span>`;
    } else if (result.quiz_correct === false) {
      quizBadge = ` <span style="color:var(--red);font-weight:600">✗ 错</span>`;
      if (result.quiz_reason) quizBadge += ` <span class="lk-err" style="font-weight:normal">${esc(result.quiz_reason.slice(0, 80))}</span>`;
    } else if (result.quiz_reason === 'pending' || result.quiz_correct === 'pending') {
      quizBadge = ` <span style="color:var(--text2)">⏳ 评分中...</span>`;
    } else if (result.quiz_correct == null && result.quiz_reason) {
      quizBadge = ` <span style="color:var(--orange)">${esc(result.quiz_reason.slice(0, 60))}</span>`;
    }
    if (quizBadge) detailStr += quizBadge;
    // title 让鼠标 hover 时显示完整内容 (因为详情列被截断了)
    const titleAttr = result.error ? `title="${esc(result.error + (result.elapsed != null ? ' (' + elapsedStr + ')' : ''))}"` : (result.content ? `title="${esc(String(result.content))}"` : '');
    const btnText = statusVal === 'cancelled' ? '⏹ 已停止' : '已完成';
    return `<tr id="${rowId}">
      <td class="lk-key" title="${esc(k.key_preview || '')}">${esc(k.key_preview || '')}</td>
      <td class="lk-status ${statusVal}">${statusLabel}</td>
      <td class="lk-elapsed">${elapsedStr}</td>
      <td class="lk-detail" ${titleAttr}>${detailStr}</td>
      <td><button class="lk-stop" disabled>${btnText}</button></td>
    </tr>`;
  }).join('');
  return `<div class="live-key-table-wrap" id="live-key-table-${cssEscape(name)}">
    <div class="lk-title">
      ${spinnerHTML}${titleText}
    </div>
    <table>
      <thead>
        <tr>
          <th>Key</th><th>状态</th><th>耗时</th><th>详情</th><th>操作</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// 轮询正在进行的验证状态（刷新页面后恢复用）
async function pollRunningStatus(name) {
  try {
    const resp = await fetch(`${API}/api/validate-status?name=${encodeURIComponent(name)}`);
    const data = await resp.json();
    if (data.finished) {
      // 验证已全部完成，从 last_status 恢复最终结果
      busySet.delete(name);
      // 获取最新的 config 来更新 validateResults
      const cfgResp = await fetch(`${API}/api/config`);
      const cfg = await cfgResp.json();
      const p = cfg.providers?.find(x => x.name === name);
      if (p?.last_status) {
        validateResults[name] = {
          status: p.last_status.status || 'error',
          model: p.last_status.model || p.selected_model || '',
          content: p.last_status.content || null,
          elapsed: p.last_status.elapsed != null ? p.last_status.elapsed : null,
          error: p.last_status.error || null,
          usage: p.last_status.usage || null,
          multi_results: p.last_status.multi_results || null,
        };
      }
      // 清理 liveKeyTableMap，切换到固化结果
      delete liveKeyTableMap[name];
      if (selectedIdx >= 0 && providersData[selectedIdx]?.name === name) {
        renderAll();
      } else {
        renderList();
      }
      return;
    }
    // 把已完成的结果填入 liveKeyTableMap
    if (data.completed) {
      for (const r of data.completed) {
        updateLiveKeyRow(name, r);
      }
    }
    // 2 秒后再查
    setTimeout(() => pollRunningStatus(name), 2000);
  } catch (e) {
    console.error('pollRunningStatus error:', e);
    // 出错也继续轮询
    setTimeout(() => pollRunningStatus(name), 3000);
  }
}

// 开测时调用：登记 key 列表（覆盖旧的已结束结果），并触发 renderDetail 重新绘制
// 同一个表格原地更新：标题变回「测试中实时状态」，所有行重置为骨架
function renderLiveKeyTableSkeleton(name, keys) {
  liveKeyTableMap[name] = { keys, results: {}, startedAt: Date.now() };
  // 清空上一轮固化的 multi_results，避免 renderLiveKeyTableHTML 再叠加渲染
  if (validateResults[name]) validateResults[name].multi_results = null;
  if (selectedIdx >= 0 && providersData[selectedIdx] && providersData[selectedIdx].name === name) {
    renderDetail();
  }
  // 启动秒钟 ticker（仅当尚未启动）
  startPendingTicker();
}

// 全局秒钟 ticker: 每秒更新所有 .lk-status.pending[data-started-at] 的文本显示秒数
// 当没有 pending 行时自动停止以节省 CPU
let pendingTickerId = null;
function startPendingTicker() {
  if (pendingTickerId) return; // 已在运行
  // 先立刻 tick 一次，避免渲染后短暂错值（不等到下一秒）
  tickPendingRows();
  pendingTickerId = setInterval(tickPendingRows, 1000);
}

function tickPendingRows() {
  const pendings = document.querySelectorAll('.lk-status.pending[data-started-at]');
  if (pendings.length === 0) {
    // 没有正在进行的骨架行，停掉 ticker
    if (pendingTickerId) {
      clearInterval(pendingTickerId);
      pendingTickerId = null;
    }
    return;
  }
  const now = Date.now();
  pendings.forEach(td => {
    const startedAt = parseInt(td.getAttribute('data-started-at'), 10);
    if (!startedAt) return;
    const sec = Math.floor((now - startedAt) / 1000);
    td.textContent = `⏳ 测试中... ${sec}s`;
  });
}

// 单个 key 完成（含 cancelled）时调用：登记结果并刷新对应行
function updateLiveKeyRow(name, result) {
  const entry = liveKeyTableMap[name];
  if (!entry) return;
  if (!result || result.key_index == null) return;
  entry.results[result.key_index] = result;
  if (selectedIdx >= 0 && providersData[selectedIdx] && providersData[selectedIdx].name === name) {
    renderDetail();
  }
}

// 智力测试：key 回答完成后、裁判结果到位前，先标记「评分中」
function updateLiveKeyRowQuizPending(name, key_index) {
  const entry = liveKeyTableMap[name];
  if (!entry) return;
  const result = entry.results[key_index];
  if (result) {
    result.quiz_correct = 'pending';
    result.quiz_reason = 'pending';
  }
  if (selectedIdx >= 0 && providersData[selectedIdx] && providersData[selectedIdx].name === name) {
    renderDetail();
  }
}

// 测试结束/出错时清理 live 状态（不再删 validateResults.multi_results，因为已结束的表格要保留）
function clearLiveKeyTable(name) {
  delete liveKeyTableMap[name];
  if (selectedIdx >= 0 && providersData[selectedIdx] && providersData[selectedIdx].name === name) {
    renderDetail();
  }
}

async function cancelKey(name, key_index, btn) {
  if (!name) return;
  // 给按钮立刻加上 stopping 样式 + 禁用，让用户看到反馈
  if (btn) {
    btn.disabled = true;
    btn.classList.add('btn-stopping');
    btn.textContent = '⏹ 停止中...';
  }
  try {
    const resp = await fetch(`${API}/api/cancel-key`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, key_index })
    });
    if (!resp.ok) {
      // 不存在或已完成：恢复按钮状态让用户看到 "已完成"
      if (btn) {
        btn.classList.remove('btn-stopping');
        btn.disabled = true;
        btn.textContent = '已完成';
      }
      const data = await resp.json().catch(() => ({}));
      showToast(`⚠️ 停止失败: ${data.error || '无对应运行中的任务'}`, 'error');
      return;
    }
    // 成功：按钮保持 disabled 状态直到收到 key_done 的 cancelled 事件再更新
    if (btn) btn.textContent = '⏹ 停止中...';
  } catch (e) {
    showToast(`❌ 停止请求失败: ${e.message}`, 'error');
    if (btn) {
      btn.classList.remove('btn-stopping');
      btn.disabled = false;
      btn.textContent = '⏹ 停止';
    }
  }
}

// 智力测试：所有 key 完成后一次性批量调裁判判定（避免 N 次单 key 裁判请求）
// 收到裁判结果后，按 key_index 把对错信息回填到 multi_results 的每条上，再 renderDetail
async function quizBatchJudge(providerName, quiz, judge, multiResults) {
  // 1) 收集成功应答的 key（过滤超时/请求失败/auth_error 等非 OK 行）
  const okResults = multiResults.filter(r => r.ok && r.content);
  if (okResults.length === 0) {
    showToast('⚠️ 无成功的 key 应答，无需裁判', 'info');
    return;
  }
  // 2) 用 key_preview（脱敏）编号提交给裁判，避免裁判看到真实 key 值
  //    编号方式：#0 #1 #2... 对应 multi_results 的 key_index
  const numberedAnswers = okResults.map(r => ({
    key_index: r.key_index,
    key_preview: r.key_preview,
    answer: String(r.content).slice(0, 500)  // 裁判读的内容，太长也截一下
  }));
  // 3) 构造裁判 prompt——让裁判一次性返回 JSON 数组列出哪些 key 正确
  const judgeResp = await fetch(`${API}/api/judge-batch`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      question: quiz.question,
      standard_answer: quiz.answer,
      answers: numberedAnswers,    // [{key_index, key_preview, answer}, ...]
      judge: {
        name: judge.name, base_url: judge.base_url,
        api_keys: judge.api_keys, type: judge.type || 'openai',
        model: judge.selected_model, timeout: judge.timeout || 60
      },
      judge_extra_headers: judge.extra_headers
    })
  });
  const judgeData = await judgeResp.json();
  // 4) 回填对错到 multi_results
  //    judgeData.results: [{key_index, correct: bool, reason: str}, ...]
  //    没结果的 key 保留 ⏳ 评分中 / 评分失败 状态
  let correctCnt = 0, wrongCnt = 0;
  if (Array.isArray(judgeData.results)) {
    for (const jr of judgeData.results) {
      const target = multiResults.find(r => r.key_index === jr.key_index);
      if (target) {
        target.quiz_correct = !!jr.correct;
        target.quiz_reason = jr.reason || '';
        if (jr.correct) correctCnt++; else wrongCnt++;
      }
    }
    // 缺失的 key 标评分失败
    for (const r of okResults) {
      if (!judgeData.results.find(x => x.key_index === r.key_index)) {
        r.quiz_correct = null;
        r.quiz_reason = '裁判未列出此 key';
      }
    }
  } else {
    // 裁判失败：所有 OK 行标失败
    for (const r of okResults) {
      r.quiz_correct = null;
      r.quiz_reason = judgeData.reason || '裁判调用失败';
    }
  }
  // 5) 触发详情区重新渲染显示结果
  if (selectedIdx >= 0 && providersData[selectedIdx] && providersData[selectedIdx].name === providerName) {
    renderDetail();
  }
  showToast(`🧠 评分完成: ${correctCnt} 对 / ${wrongCnt} 错`, correctCnt > 0 ? 'success' : 'error');
  // 6) 持久化评分结果到后端（切换 provider / 刷新页面不丢失）
  try {
    const firstResult = okResults[0] || multiResults[0];
    await fetch('/api/save-quiz-result', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name: providerName,
        quiz_correct: firstResult?.quiz_correct ?? null,
        quiz_reason: firstResult?.quiz_reason || '',
        quiz_score_summary: `${correctCnt} 对 / ${wrongCnt} 错`,
        multi_results: multiResults,
      })
    });
  } catch(e) { /* 非关键 */ }
}

async function validateSingle(name, quizMode = false) {
  // quizMode=true 走智力测试：prompt 换成题目内容，每个 key 回答后调 /api/judge 判定
  const quiz = quizMode ? getCurrentQuiz() : null;
  const judge = quizMode ? getJudgeProvider() : null;
  if (quizMode && (!quiz || !judge)) {
    showToast('⚠️ 请先在「🧠 智力测试」菜单选择题目和裁判 provider', 'error');
    return;
  }
  if (quizMode && judge && (!judge.api_keys || judge.api_keys.length === 0 || !judge.api_keys[0])) {
    showToast(`⚠️ 裁判「${judge.name}」没有 API Key，无法评分。请先填写或换个裁判`, 'error');
    return;
  }
  busySet.add(name); renderAll();
  const stream = document.getElementById('chkStream').checked;
  // 关键：renderAll() 已重建 detail-card 结构；我们的实时表格需要在 renderAll 之后立刻重建。
  // 但 start 事件还没到——这里先不做任何事，等待 SSE start。
  try {
    // 把 provider 完整信息一起传过去，这样新增未保存的也能验证
    const p = providersData.find(x => x.name === name);
    const payload = p
      ? { name, stream, base_url: p.base_url, api_keys: p.api_keys, type: p.type || 'openai', model: p.selected_model || '', timeout: p.timeout || 60, extra_headers: p.extra_headers || {}, prompt: quiz ? quiz.question : 'hi' }
      : { name, stream, prompt: quiz ? quiz.question : 'hi' };
    const resp = await fetch(`${API}/api/validate`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });

    // SSE 流式读取：每个 key 验证完立刻显示
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let multiResults = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n\n')) >= 0) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        const lines = raw.split('\n');
        let dataLine = '';
        let eventType = '';
        for (const line of lines) {
          if (line.startsWith('event: ')) eventType = line.slice(7).trim();
          else if (line.startsWith('data: ')) dataLine += line.slice(6);
        }
        if (!dataLine) continue;
        try {
          const data = JSON.parse(dataLine);
          if (eventType === 'start') {
            // 收到 key 列表：渲染骨架表格
            const keyList = (data.keys || []).map(k => ({ key_index: k.key_index, key_preview: k.key_preview }));
            renderLiveKeyTableSkeleton(name, keyList);
          } else if (eventType === 'key_done') {
            // 单个 key 验证完（含 cancelled），更新对应行 + 推日志
            if (data.log) addLogEntry(data.log);
            multiResults.push(data);
            updateLiveKeyRow(name, data);
            // 智力测试模式：先在行上标「⏳ 评分中」（所有 key 完成后统一调裁判）
            if (quizMode && data.ok && data.content) {
              updateLiveKeyRowQuizPending(name, data.key_index);
            }
          } else if (eventType === 'done') {
            // 全部完成：移除实时表格，刷新 provider 状态（固化最终表格）
            clearLiveKeyTable(name);
            // 优先使用后端汇总的 multi_results，避免前端漏掉 cancelled 行
            // 单 key 场景后端可能不返回 multi_results，用前端收集的 multiResults 兜底
            const finalMulti = data.multi_results || (multiResults.length >= 1 ? multiResults : null);
            const firstResult = (finalMulti && finalMulti[0]) || multiResults[0];
            validateResults[name] = {
              status: data.status, model: firstResult?.model,
              content: firstResult?.content, usage: firstResult?.usage,
              error: firstResult?.error, stream: firstResult?.stream,
              elapsed: firstResult?.elapsed,
              multi_results: finalMulti,
            };
            renderAll();
            // 智力测试模式：所有 key 完成后一次批量调裁判判定（省 N 倍 API 调用）
            if (quizMode && finalMulti) {
              await quizBatchJudge(name, quiz, judge, finalMulti);
            }
          } else if (eventType === 'error') {
            clearLiveKeyTable(name);
            showToast(`❌ 「${name}」验证失败: ${data.error || '未知错误'}`, 'error');
          }
        } catch(e) { /* 忽略解析错误 */ }
      }
    }
  } catch(e) {
    clearLiveKeyTable(name);
    showToast('❌ 验证失败: ' + e.message, 'error');
  }
  busySet.delete(name);
  clearLiveKeyTable(name); // 防御性兜底：确保实时表格被清理
  renderAll();
}

async function validateAll() {
  const stream = document.getElementById('chkStream').checked;
  // 把所有有模型的 provider 加入 busySet
  providersData.forEach(p => { if (p.selected_model) busySet.add(p.name); });
  renderAll();
  try {
    const resp = await fetch(`${API}/api/validate-all`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ stream }) });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let timeoutBumps = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      // SSE 以 \n\n 分割事件
      let idx;
      while ((idx = buffer.indexOf('\n\n')) >= 0) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        // 解析 SSE 事件
        const lines = raw.split('\n');
        let dataLine = '';
        let eventType = '';
        for (const line of lines) {
          if (line.startsWith('data: ')) dataLine = line.slice(6);
          else if (line.startsWith('event: ')) eventType = line.slice(7);
        }
        if (eventType === 'done' || !dataLine) continue;
        try {
          const msg = JSON.parse(dataLine);
          if (msg.type === 'log' && msg.log) {
            addLogEntry(msg.log);
          } else if (msg.type === 'result' && msg.result) {
            const r = msg.result;
            validateResults[r.name] = { status: r.status, model: r.model, content: r.content, usage: r.usage, error: r.error, stream: r.stream, elapsed: r.elapsed };
            if (r.timeout) {
              const p = providersData.find(x => x.name === r.name);
              if (p) p.timeout = r.timeout;
              timeoutBumps++;
            }
            busySet.delete(r.name); // 完成的 provider 解除禁用
            renderAll();
          }
        } catch(e) {}
      }
    }
    if (timeoutBumps > 0) {
      showToast(`⏱ ${timeoutBumps} 个 provider 超时，已翻倍超时上限`, 'error', 5000);
    }
  } catch(e) { showToast('❌ 批量验证失败: ' + e.message, 'error'); }
  busySet.clear();
  renderAll();
}

// ─── 日志 ─────────────────
function parseDetail(detail) {
  // detail 格式: "─── Request ───\n...\n\n─── Response ...───\n..."
  // 拆成 request 和 response 两部分
  const marker = '\n\n─── Response';
  const idx = detail.indexOf(marker);
  if (idx >= 0) {
    let req = detail.slice(0, idx).replace('─── Request ───\n', '');
    let resp = detail.slice(idx + 2); // 保留 "─── Response ..."
    return { request: req, response: resp };
  }
  // 没有找到分隔，只有 timeout/error 的情况
  // 检查是否以 "─── Request" 开头
  if (detail.startsWith('─── Request')) {
    return { request: detail.replace('─── Request ───\n', ''), response: '' };
  }
  // 只有 response 的情况（如 timeout）
  return { request: '', response: detail };
}

function getCurrentLogEntries() {
  const p = providersData[selectedIdx];
  return p ? (logEntriesByProvider[p.name] || []) : [];
}

function addLogEntry(l) {
  if (!l) return;
  const providerName = l.provider || (providersData[selectedIdx] && providersData[selectedIdx].name) || '';
  if (!providerName) return;
  const now = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  const entryId = ++logEntryCounter;
  if (!logEntriesByProvider[providerName]) logEntriesByProvider[providerName] = [];
  logEntriesByProvider[providerName].unshift({ id: entryId, time: now, ...l, provider: providerName, url: l.url || '' });
  logTabStates[entryId] = 'response'; // 默认 Response tab
  // 只在当前选中 provider 时刷新显示
  const currentP = providersData[selectedIdx];
  if (currentP && currentP.name === providerName) renderLog();
}

function renderLog() {
  const el = document.getElementById('logBody');
  const entries = getCurrentLogEntries();
  if (entries.length === 0) { el.innerHTML = '<span style="color:var(--text2);font-style:italic">等待操作...</span>'; return; }
  el.innerHTML = entries.map(e => {
    const s = parseInt(e.status) || 0;
    const sc = s >= 200 && s < 300 ? 's2xx' : s >= 400 && s < 500 ? 's4xx' : s >= 500 ? 's5xx' : 's0';
    const mc = (e.method || 'GET').toUpperCase();
    let detailHTML = '';
    if (e.detail) {
      const { request, response } = parseDetail(e.detail);
      const activeTab = logTabStates[e.id] || 'response';
      const reqActive = activeTab === 'request' ? 'active' : '';
      const respActive = activeTab === 'response' ? 'active' : '';
      const reqDisplay = activeTab === 'request' ? '' : 'display:none';
      const respDisplay = activeTab === 'response' ? '' : 'display:none';
      detailHTML = `<div class="log-detail">
        <div class="log-detail-tabs">
          <div class="log-detail-tab ${reqActive}" onclick="switchLogTab(${e.id},'request')">Request</div>
          <div class="log-detail-tab ${respActive}" onclick="switchLogTab(${e.id},'response')">Response</div>
        </div>
        ${request ? `<div class="log-detail-content" id="log-req-${e.id}" style="${reqDisplay}">${esc(request)}</div>` : ''}
        ${response ? `<div class="log-detail-content" id="log-resp-${e.id}" style="${respDisplay}">${esc(response)}</div>` : ''}
      </div>`;
    }
    return `<div class="log-entry">
      <span class="log-time">${e.time}</span>
      ${e.provider ? `<span class="log-provider-tag">${esc(e.provider)}</span>` : ''}
      <span class="log-method ${mc}">${mc}</span>
      <span class="log-url">${esc(e.url)}</span>
      ${e.status ? `<span class="log-status ${sc}">${e.status}</span>` : ''}
      ${detailHTML}
    </div>`;
  }).join('');
  el.scrollTop = 0;
}

function switchLogTab(entryId, tab) {
  logTabStates[entryId] = tab;
  const reqEl = document.getElementById('log-req-' + entryId);
  const respEl = document.getElementById('log-resp-' + entryId);
  // 更新 tab active 状态
  const tabs = document.querySelectorAll('.log-detail-tab');
  tabs.forEach(t => {
    if (t.getAttribute('onclick') === `switchLogTab(${entryId},'request')`) {
      t.classList.toggle('active', tab === 'request');
    }
    if (t.getAttribute('onclick') === `switchLogTab(${entryId},'response')`) {
      t.classList.toggle('active', tab === 'response');
    }
  });
  if (reqEl) reqEl.style.display = tab === 'request' ? '' : 'none';
  if (respEl) respEl.style.display = tab === 'response' ? '' : 'none';
}

async function clearLogs() {
  const p = providersData[selectedIdx];
  if (!p) { showToast('⚠️ 请先选择一个 Provider', 'error', 3000); return; }
  // 前端立即清空
  logEntriesByProvider[p.name] = [];
  renderLog();
  // 后端也清空
  try {
    await fetch(`${API}/api/clear-logs`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: p.name}) });
  } catch(e) {}
}

// ─── 复制 curl 命令 ─────────────────
function copyCurlModels(platform) {
  if (selectedIdx < 0) { showToast('⚠️ 请先选择或添加一个 Provider', 'error', 4000); return; }
  const p = providersData[selectedIdx];
  if (!p.base_url) { showToast('⚠️ 请先填写 Base URL', 'error', 4000); return; }
  if (!p.api_keys || !p.api_keys.length) { showToast('⚠️ 请先填写 API Key', 'error', 4000); return; }

  const base = normalizeBaseUrl(p.base_url);
  const url = base + '/models';
  const curl = buildCurl('GET', url, {'Authorization': 'Bearer ' + p.api_keys[0]}, platform);
  copyToClipboard(curl, platform === 'linux' ? '🐧 models' : '🪟 models');
}

function copyCurlValidate(platform) {
  if (selectedIdx < 0) { showToast('⚠️ 请先选择或添加一个 Provider', 'error', 4000); return; }
  const p = providersData[selectedIdx];
  if (!p.base_url) { showToast('⚠️ 请先填写 Base URL', 'error', 4000); return; }
  if (!p.api_keys || !p.api_keys.length) { showToast('⚠️ 请先填写 API Key', 'error', 4000); return; }
  if (!p.selected_model) { showToast('⚠️ 请先选择或输入模型名称', 'error', 4000); return; }

  const base = normalizeBaseUrl(p.base_url);
  let url, headers, body;
  if (p.type === 'anthropic') {
    url = base + '/v1/messages';
    headers = {'x-api-key': p.api_keys[0], 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json'};
    body = JSON.stringify({model: p.selected_model, max_tokens: 50, messages: [{role: 'user', content: 'hi'}]});
  } else {
    url = base + '/chat/completions';
    headers = {'Authorization': 'Bearer ' + p.api_keys[0], 'Content-Type': 'application/json'};
    body = JSON.stringify({model: p.selected_model, messages: [{role: 'user', content: 'hi'}], max_tokens: 50});
  }
  const curl = buildCurl('POST', url, headers, platform, body);
  copyToClipboard(curl, platform === 'linux' ? '🐧 verify' : '🪟 verify');
}

function normalizeBaseUrl(url) {
  if (!url) return '';
  url = url.trim();
  if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
  url = url.replace(/\/+$/, '');
  if (!url.endsWith('/v1')) url += '/v1';
  return url;
}

// 拼 curl 命令：GET 不加 body，POST 加 -d
function buildCurl(method, url, headers, platform, body) {
  const sep = platform === 'linux' ? '\\' : '^';
  let cmd = `curl -X ${method} "${url}"`;
  for (const [k, v] of Object.entries(headers)) {
    cmd += ` ${sep}\n  -H "${k}: ${v}"`;
  }
  if (body) {
    // Windows cmd: 双引号内需要转义内部双引号为 \"
    const escaped = platform === 'win' ? body.replace(/"/g, '\\"') : body;
    cmd += ` ${sep}\n  -d "${escaped}"`;
  }
  return cmd;
}

function copyToClipboard(text, label) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast(`📋 已复制 ${label} 命令`, 'success');
  } catch(e) {
    showToast('❌ 复制失败，请手动选择复制', 'error');
  }
  document.body.removeChild(ta);
}

// ─── 工具 ─────────────────
function maskKey(key) {
  if (!key || key.length < 8) return key || '';
  return key.slice(0, 6) + '***' + key.slice(-4);
}
// 把 api_keys array 转成换行分隔的 textarea 文本
function keysToText(keys) {
  return (keys || []).join('\n');
}
// 多 key 脱敏：每行一个 key，各自 mask，忽略空行
function maskMultiKey(raw) {
  if (!raw) return '';
  const parts = String(raw).split('\n').map(k => k.trim()).filter(k => k);
  if (parts.length <= 1) return maskKey(String(raw).trim());
  return parts.map(k => maskKey(k)).join('\n');
}
function setBusy(b) { busy = b; if (b) renderAll(); else renderAll(); }

  const stream = document.getElementById('chkStream').checked;

    await fetch(`${API}/api/stream`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ stream }) });
